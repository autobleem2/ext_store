[extension]
Name=AutoBleem Store
Description=Download apps and games
Author=AutoBleem team
Version=1.0.0
# resolved by AppManifest's rule; .so / .dll is added per platform
Plugin=bin/{key}/store
# loaded at start-up: its downloads go on while the carousel is showing
Background=true
# of no use offline: the launcher does not open it without a network
Network=required
